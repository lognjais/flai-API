# Part of what "finished" means: nobody has to remember to run the tests.
# The suite is pure logic with no network, so it needs no secrets and no services.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Matches render.yaml and the Dockerfile. Active LTS until 30 April 2028.
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm test
      # Catches the failure mode that a unit test cannot: a bad import path or a config schema
      # that rejects a valid environment only shows up when the process actually boots.
      - name: boot and answer /healthz
        env:
          PASS: ci-smoke-password
          PORT: '5099'
          LOG_LEVEL: warn
        run: |
          node src/server.js &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:5099/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5099/healthz | tee /dev/stderr | grep -q '"ok":true'
