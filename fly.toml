app = "flai-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  ALLOWED_ORIGINS = "https://jvoltci.github.io,https://flai.ivehement.com"
  KEEP_WARM_INTERVAL_MS = "600000"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 5000
  force_https = true
  # The whole point of choosing Fly: the machine never auto-stops.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
