services:
  - type: web
    name: flai-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node src/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PASS
        sync: false
      - key: DATABASE
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://jvoltci.github.io,https://flai.ivehement.com
      - key: PUBLIC_URL
        value: https://flai-api.onrender.com
      - key: KEEP_WARM_INTERVAL_MS
        value: "600000"
      - key: LOG_LEVEL
        value: info
